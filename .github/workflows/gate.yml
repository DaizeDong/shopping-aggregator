name: gate
# The skill's first executable lint gate (PHILOSOPHY P2: mechanism, not intention). Runs the
# deterministic artifact/contract checks in tools/verify_matrix.py on every push and PR. Exit
# non-zero = BLOCK the change. Detection only — it never edits the matrix.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The guards submodule holds datadir.py, which this repo's code resolves at runtime.
        # Without this the directory is present and EMPTY, and the failure is not a missing
        # checkout, it is whatever the code does when its resolver is absent.
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run deterministic matrix gate (offline — network gates skipped via --no-net)
        # --no-net keeps CI deterministic + hermetic: the REPO/STAR/GHACTIVE network gates need a
        # gh token + live GitHub and would make every push flaky on rate-limits / transient 5xx.
        # They are a maintainer-side check (run `python tools/verify_matrix.py` locally, authenticated,
        # before a matrix change). CI enforces every offline durable-contract + data-integrity check.
        run: python tools/verify_matrix.py --no-net

      # The freshness gate's own tests. Its logic is pure local arithmetic (an age against a
      # per-file declared cadence), so it is unit-tested directly rather than through the matrix
      # gate, which would burn GitHub API quota to assert date maths. ABSENT is a failure, not a
      # reason to skip, same rule the pii-guard workflow states: a guard that is not here is not a
      # guard. Verified by deleting the file and watching this step exit non-zero.
      - name: Data-freshness gate tests (can it still tell stale from unchecked?)
        run: |
          # pytest was never installed in this job, so the step died with "No module named pytest"
          # and the gate has been red since it was added. The error text above it says the test file
          # is MISSING, which it is not: that message sent two separate investigations after a file
          # that was tracked, committed and present in the very commit under test. An error that
          # names the wrong cause costs more than no error.
          python -m pip install --quiet pytest
          test -f tools/test_data_freshness.py || { echo "::error::tools/test_data_freshness.py is MISSING from this repo. It is not part of the guards submodule; it belongs here."; exit 1; }
          python -m pytest tools/test_data_freshness.py -q
