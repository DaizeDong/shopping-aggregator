name: heartbeat
# Closes the "machine was off -> monthly refresh silently skipped, nobody knows" gap (open-loop
# liveness). On the 5th of each month, check whether a refresh branch/commit appeared this month;
# if not, open an issue so the missed run is VISIBLE (PHILOSOPHY P6: degradation that's hidden
# compounds). This is detection only — it never edits the matrix.
on:
  schedule:
    - cron: '0 12 5 * *'   # 12:00 UTC on the 5th
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-liveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Detect missing monthly refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MONTH=$(date -u '+%Y-%m')
          # any commit this month touching the source matrix?
          # NOTE the explicit T00:00:00. Without it git parses "2026-08-01" with approxidate,
          # which fills the MISSING time fields from the CURRENT clock: on a run at 12:00 UTC
          # the window silently starts at 12:00 on the 1st, not midnight. That is the wrong
          # direction for this check. The refresh it is watching fires at 07:00 UTC, so a
          # perfectly successful refresh landed 5 hours BEFORE the window opened and this
          # heartbeat would open an issue saying it never happened. Demonstrated 2026-08-20 on
          # a scratch repo: one commit at 00:30 on the 1st, --since="2026-08-01" found 0,
          # --since="2026-08-01T00:00:00" found 1.
          HITS=$(git log --since="${MONTH}-01T00:00:00" --oneline -- skills/shopping-aggregator/reference | wc -l)
          if [ "$HITS" -eq 0 ]; then
            echo "No refresh commit found for $MONTH — opening heartbeat issue."
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "heartbeat: no shopping-aggregator refresh in $MONTH" \
              --body "The scheduled monthly refresh produced no commit to the source matrix this month. Likely the local machine was off, or the run failed. Please check the local refresh log and re-run the refresh manually if needed." \
              || echo "issue create failed"
          else
            echo "Refresh activity detected for $MONTH ($HITS commit(s)) — healthy."
          fi
